<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container">
        <div class="chatbot-card">
            <div class="chat-header">FAQ Chatbot</div>
            <div class="chat-box" id="chatBox">
                <div class="message bot">
                    <div class="bubble">Hello! Ask me a question about Python, AI, machine learning, or programming basics.</div>
                </div>
            </div>

            <div class="typing" id="typingIndicator">Bot is typing...</div>

            <div class="chat-input-area">
                <input id="questionInput" type="text" placeholder="Type your question here..." aria-label="Ask a question" />
                <button id="sendButton" type="button">Send</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
