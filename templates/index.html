<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="page-wrapper">
        <header>
            <h1>Language Translation Tool</h1>
            <p>Translate text locally using LibreTranslate.</p>
        </header>

        <main class="card">
            <label for="sourceText">Enter text to translate</label>
            <textarea id="sourceText" rows="6" placeholder="Type a sentence here..."></textarea>

            <div class="row">
                <div class="field-group">
                    <label for="sourceLang">Source language</label>
                    <select id="sourceLang">
                        <option value="auto">Auto Detect</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>
                <div class="field-group">
                    <label for="targetLang">Target language</label>
                    <select id="targetLang">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>
            </div>

            <div class="controls">
                <button id="translateButton" class="primary">Translate</button>
                <button id="clearButton" type="button">Clear</button>
            </div>

            <div id="statusMessage" class="status" aria-live="polite"></div>

            <label for="translationResult">Translation result</label>
            <div id="translationResult" class="result" aria-live="polite"></div>

            <div class="controls secondary-controls">
                <button id="copyButton" type="button">Copy</button>
                <button id="ttsButton" type="button">Text to Speech</button>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
